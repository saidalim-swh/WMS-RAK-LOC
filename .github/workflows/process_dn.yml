name: Process Delivery Note

on:
  schedule:
    - cron: "*/3 1-5 * * 1-6"
  workflow_dispatch:
  repository_dispatch:
    types: [dn-upload]

jobs:
  process-dn:
    runs-on: ubuntu-latest

    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
      FOLDER_ID_DN_MASUK: ${{ secrets.FOLDER_ID_DN_MASUK }}    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pdfplumber google-api-python-client google-auth

      - name: Run Delivery Note Processor
        run: |
          python process_dn.py
